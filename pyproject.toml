[project]
name = "gemma4-demo"
version = "0.1.0"
description = "Gemma 4 OpenVINO inference demo"
requires-python = ">=3.11"
dependencies = [
    "optimum-intel",
    "openvino",
    "nncf",
    "transformers==5.5.0",
    "torch>=2.10",
    "torchvision",
    "Pillow",
    "gradio>=6.0",
    "opencv-python",
    "requests",
    "matplotlib",
]

[tool.uv]
package = false
prerelease = "allow"
index-strategy = "unsafe-best-match"
override-dependencies = [
    "transformers==5.5.0",
]

[tool.uv.sources]
optimum-intel = { git = "https://github.com/rkazants/optimum-intel.git", branch = "support_gemma4" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
name = "openvino-nightly"
url = "https://storage.openvinotoolkit.org/simple/wheels/nightly"
