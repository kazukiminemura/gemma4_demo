[project]
name = "gemma4-demo"
version = "0.1.0"
description = "Gemma 4 OpenVINO inference demo"
requires-python = ">=3.11"
dependencies = [
    "optimum-intel",
    "openvino",
    "nncf",
    "transformers",
    "torch>=2.10",
    "torchvision",
    "Pillow",
    "gradio>=6.0",
    "opencv-python",
    "requests",
    "matplotlib",
    "openvino-genai>=2026.2.0.0",
]

[tool.uv]
package = false
prerelease = "allow"
index-strategy = "unsafe-best-match"
override-dependencies = [
    "transformers @ git+https://github.com/huggingface/transformers.git@d3f05911abb216047a00aba79c8543c73633db05",
]

[tool.uv.sources]
optimum-intel = { git = "https://github.com/rkazants/optimum-intel.git", branch = "support_gemma4" }
transformers = { git = "https://github.com/huggingface/transformers.git", rev = "d3f05911abb216047a00aba79c8543c73633db05" }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
openvino = { index = "openvino-nightly" }
openvino-tokenizers = { index = "openvino-nightly" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "openvino-nightly"
url = "https://storage.openvinotoolkit.org/simple/wheels/nightly"
explicit = true
